spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: task-management-admin
              uri: http://localhost:8081
              predicates:
                - Path=/admin/**

            - id: task-management-auth
              uri: http://localhost:8081
              predicates:
                - Path=/task/auth/**

            - id: task-management-board
              uri: http://localhost:8081
              predicates:
                - Path=/board/**

            - id: task-management-task
              uri: http://localhost:8081
              predicates:
                - Path=/task/**

            - id: finance-tracker-auth
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            - id: finance-tracker-budgets
              uri: http://localhost:8082
              predicates:
                - Path=/budgets/**

            - id: finance-tracker-transaction
              uri: http://localhost:8082
              predicates:
                - Path=/transaction/**

server:
  port: 8080


eureka:
  client:
    service-url:
      defaultZone: http://localhost:9000/eureka/
    register-with-eureka: true
    fetch-registry: true